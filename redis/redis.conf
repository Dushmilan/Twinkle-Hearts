# Redis Configuration for Twinkle-Hearts
# Private Commercial Project - Confidential

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Persistence (AOF - Append Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice

# Security (Uncomment for production)
# requirepass your-strong-password-here

# Performance
tcp-keepalive 300
timeout 0
